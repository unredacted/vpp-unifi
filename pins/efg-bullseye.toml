# VPP pin for the UniFi EFG (Enterprise Fortress Gateway) on UniFi OS
# 5.x and earlier (Debian 11, bullseye). Named for its distro like
# pins/efg-trixie.toml; this file also holds the hardware record both
# EFG pins share.
#
# THIS FILE IS A BUILD TRIGGER. Editing it runs
# `.github/workflows/build.yml`, which builds *unmodified upstream*
# VPP inside a container matching [target] below and publishes the
# .debs + API definitions under their own release tag,
# `vpp-<ref>-<platform>-<distro>-<arch>`. The tag is deliberately
# gateway-agnostic: two gateways sharing a platform share one
# artifact. The first job checks whether that exact artifact is
# already published and skips the build entirely if so, so an
# accidental trigger costs seconds.
#
# Why we build at all (settled empirically 2026-08-01/02). Precisely:
# fd.io DOES publish Debian bullseye packages in its per-release
# repos (fdio/<YYMM>) — but amd64 only. Its arm64 builds are
# Ubuntu-only (jammy/noble). So bullseye+arm64, the one combination
# UniFi OS can install, is published nowhere at any version, and
# Debian has never packaged VPP. Substituting the jammy arm64 deb
# fails three ways: bullseye's dpkg can't unpack its zstd members, and
# its symbol floor is GLIBC_2.34 against our 2.31. Full record:
# github.com/unredacted/packetframe, docs/runbooks/vpp-offload-spike.md.
#
# We ship NO patches. This is repackaging, not forking.

[target]
# The gateway this pin serves. Informational in the release notes;
# the artifact identity is (vpp ref × platform × distro × arch).
gateway = "efg"

# UniFi EFG hardware/OS facts, verified on the reference device:
#   SoC: Marvell CN9670 — CN96xx D0 stepping (MIDR 0x43/0xB2/3/0)
#   UniFi OS 4.x base: Debian 11 (bullseye), arm64, glibc 2.31
#
# distro/arch pick the build container and runner; glibc_floor is the
# maximum symbol version the published binaries may require — the
# exact check that killed the fd.io jammy deb (GLIBC_2.34 vs 2.31).
distro = "bullseye"
arch = "arm64"
glibc_floor = "2.31"

[vpp]
# Git ref in github.com/FDio/vpp. Use a release tag, never a branch:
# branches move, and a moving pin defeats the point.
#
# Default to newest, not oldest. Newest gets security fixes and
# upstream support; you drop back only when something forces you to,
# and "might not build" was not a good enough reason — VPP's Makefile
# (stable/2606, and still v26.10) has explicit `debian-11` handling, so bullseye is a
# supported build host. (An earlier version of this file pinned 23.06
# on the assumption that newer lines had dropped Debian 11. That was
# inferred from fd.io's *package* matrix, which describes their CI,
# not what the source can build. Checked, wrong, corrected.)
#
# That said, "install-dep succeeds" is NOT the same as "bullseye's
# toolchain is new enough". 26.06 and 26.10 require CMake >= 3.19 and bullseye
# ships 3.18.4, so the workflow installs upstream CMake before
# building. Expect that supplementing to be the shape of any future
# obstacle on this line: dependency PACKAGING still targets debian-11,
# but individual TOOL floors have moved past it. If the list of
# supplements ever grows past a couple of pinned tools, that is the
# signal to take the fallback ladder below rather than to keep
# rebuilding bullseye's toolchain from tarballs.
#
# v26.06 was tried on the reference EFG (2026-08-02) and its cnxk PMD
# fails BEFORE the mailbox — this is measured, not assumed:
#
#   CNXK: populate_model(): Invalid RoC model (impl=0x43, part=0xb2,
#                                              major=0x3, minor=0x0)
#   CNXK: cn9k_nix_probe(): Failed to initialize platform model, rc=-22
#
# The cn9670 reports MIDR variant 3 — a die stepping absent from
# drivers/common/cnxk/roc_model.c in EVERY public DPDK (the CN96xx
# table stops at variant 2), and unknown MIDR is a hard -EINVAL with
# no override (checked in v26.03 source: no env, no devargs, no
# default-to-nearest). That gates the ENTIRE cnxk era, so the middle
# fallback rungs (v25.10 / v24.10 / v23.06) would fail identically
# and are SKIPPED on purpose.
#
# The octeontx2 era has no such gate: DPDK 21.11's otx2 code reads no
# MIDR at probe (verified in source), and DPDK 20.11 testpmd moved
# real packets on this exact silicon. Hence v22.02 —
# DPDK 21.11, the last `octeontx2`-named era. Note 21.11 ships BOTH
# PMD families; if its cnxk half hits the same model gate, EAL tries
# the next matching driver, which is exactly the gate-free octeontx2.
#
# v22.02 was then tried on the EFG (2026-08-02) and settled the
# big question: **the AF↔VF mailbox WORKS.** DPDK 21.11's otx2 PMD
# probed the VF through the SDK-era AF — interface created, MAC
# assigned, full capability tables read. It then failed one layer up:
#
#   PMD: otx2_nix_rx_queue_setup(): mempool ops should be of
#        octeontx2_npa type   (rte_eth_rx_queue_setup -> -22)
#
# Both otx2 and cnxk hard-require NPA mempool ops for packet buffers
# (checked in 21.11 and 26.03 source — no bypass, no devarg), and
# mainline VPP's buffer manager only provides its own "vpp" mempool
# ops. So DPDK-PMD-inside-VPP is a dead end on this NIC at EVERY
# version — the wall is VPP<->PMD buffer integration, not the
# hardware, the kernel, or the era.
#
# The mainline path that remains is VPP's NATIVE octeon driver
# (src/drivers/octeon), and every piece checks out in source:
#   - it is gated on VPP_PLATFORM octeon9|octeon10 — which is why the
#     generic build never contained it;
#   - it links marvell-octeon-roc, and octeon-roc v26.05's model
#     table (unlike DPDK's stale copy) HAS the cn9670's stepping:
#     MIDR (0x43, 0xB2, major=3, minor=0) = **CN96xx D0**
#     (still there in v26.09.01, the octeon-roc VPP v26.10 links;
#     DPDK's copy still lacks it as of v26.11-rc3);
#   - CN9K support is first-class (roc_model_is_cn9k() paths,
#     PLATFORM_OCTEON9 defines).
# Hence: ref back to latest stable, platform=octeon9. The native
# driver is configured through VPP's vnet/dev `devices {}` startup
# stanza, NOT `dpdk {}`.
#
# Kept for the record (all measured on the reference EFG, 2026-08-02):
#   - v26.06 generic: cnxk PMD fails PRE-mailbox — DPDK's
#     drivers/common/cnxk/roc_model.c stops at CN96xx variant 2 and
#     hard-fails unknown MIDR with no override. Upstreaming the D0
#     entry to DPDK (sync from octeon-roc) was considered and dropped:
#     DPDK is not on our path, and fixes to dependencies stay out of
#     upstream trackers (issue #1).
#   - v25.10 / v24.10 / v23.06: same stale table, same failure, skip.
#   - v22.02 generic: mailbox PASSES, rx queue setup fails on NPA
#     mempool ops (above). The mailbox-proof artifact tag
#     (vpp-v22.02-generic-bullseye-arm64) remains published on
#     unredacted/packetframe, where these builds originally lived.
#
# Moved from v26.06 to v26.10 (tagged 2026-10-28). Against the
# 16 .api files PacketFrame vendors, only interface.api changed, and
# only by adding messages (sw_interface_set_link_speed,
# sw_interface_get_speed_capa and its reply): no message PacketFrame
# speaks changed, so its attach-time CRC check is unaffected. The
# octeon driver did change: per-thread, per-device auras; TX auras
# cleaned up on teardown; drain-queue, port-start return value and flow
# parsing fixes; settable link speed; octeon-roc 26.05 -> 26.09.01. None
# of that was backported to stable/2606, and it is datapath code, so a
# v26.10 build runs on a lab EFG before any production gateway takes it.
# The last hardware-validated build is vpp-v26.06-8a556fbe1-octeon9-*.
ref = "v26.10"

# The release's maintenance fixes. FD.io has tagged no point release
# (vYY.MM.N) since v22.10.1: fixes for a release land on its
# `stable/YYMM` branch, and FD.io's own packages are built from that
# branch (versioned like 26.10.0-16~gb4caea981). So `branch` names that
# stable branch and `commit` the exact commit on it to build, in full.
# The workflow checks the commit is on `branch` and descends from `ref`,
# and names the release after both (vpp-v26.10-b4caea981-...). The
# branch moves; the commit is what makes the build reproducible, and
# moving to newer fixes is a deliberate bump of `commit`.
#
# Without `branch`, `ref` alone is built, and a non-empty `commit` is a
# strict pin: the workflow fails if the tag resolves elsewhere (upstream
# retag).
#
# b4caea981 = v26.10 + 16 (stable/2610 head, 2026-11-18). Two touch
# code: the punt-drop feature arc (d5679a54c) and ip6-nd no longer
# learning the router's own addresses (9376905b9); the rest are CI and
# docs. The one .api change, in ip.api, adds an error counter
# (neighbor_advertisement_target_local), not a message, so no API CRC
# moves. The fixes the previous pin (stable/2606 at 8a556fbe1) was
# taken for are all on this branch too: the ip6-nd link-local NS crash
# (7289cb00f), NS validation before learning (5eb79c9f2), monotonic VPP
# time (ab5beac21), no os_panic on an untranslatable ICMP inner protocol
# (380bd0d1f), and the mss_clamp TCP header checks (before the branch
# point).
branch = "stable/2610"
commit = "b4caea9817032447f0ee29ffecec35b46a7143dd"

# Build variant. Changing this produces a separately-tagged artifact;
# variants coexist on the release page.
#   "octeon9" = VPP_PLATFORM=octeon9: the ONLY shape that builds the
#               native octeon driver (armv8.2-a+crc+crypto, 128B cache
#               lines — correct for CN96xx). Required for the EFG;
#               see above for why the DPDK PMD path cannot work.
#   "generic" = baseline armv8-a, no octeon driver. Useful only for
#               non-datapath testing of VPP itself.
#   "cn9k"    = legacy DPDK-era tuning (octeontx2-era pins like
#               v22.02): DPDK_MACHINE=cn9k + -mcpu=octeontx2.
platform = "octeon9"
