name: VPP upstream watch

# Dependabot for VPP. Dependabot itself cannot (see .github/dependabot.yml):
# the pins are this repo's own TOML, and VPP is followed by git branch and
# commit, not as a package.
#
# Weekly, for each stable branch the pins build (`branch` + `commit`):
#   - when the branch head has moved past the pinned commit, open a PR that
#     moves every pin on that branch to the new head, list the upstream
#     commits, flag any changed .api file (PacketFrame's vpp-offload checks
#     VPP's API CRCs at attach, so an API change needs a PacketFrame build
#     generated against it), and start a build-and-verify run of the PR
#     branch (publish off);
#   - when FD.io has tagged a newer release line than a pin's `ref`, open a
#     PR that moves every pin on that `ref` to the new line (its
#     `stable/YYMM` head, or the bare tag while that branch does not exist
#     or does not descend from the tag), list the changed .api files with
#     the ones PacketFrame vendors called out, and start the same
#     build-and-verify run. Merging publishes a release and moves nothing on
#     a gateway: PacketFrame re-vendors against it and a lab gateway runs it
#     first. Once merged, the pins name the new stable branch and the step
#     above follows it.
#
# A PR opened with GITHUB_TOKEN gets no `pull_request` runs (or only ones
# awaiting approval), and checks from `workflow_dispatch` runs are not shown
# on a PR. So this dispatches build.yml (build-and-verify, publish off) and
# pins.yml on the PR branch, waits for them, and posts each result as a
# commit status on the PR's head commit, which the PR does show.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  statuses: write

concurrency:
  group: vpp-upstream
  cancel-in-progress: false

jobs:
  watch:
    name: Watch FDio/vpp
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: https://github.com/FDio/vpp
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Propose stable-branch bumps
        shell: bash
        run: |
          set -euo pipefail
          field() { grep -E "^\s*$1\s*=" "$2" | head -1 | cut -d'"' -f2 || true; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          declare -A done_key=()
          for pin in pins/*.toml; do
            branch=$(field branch "$pin"); commit=$(field commit "$pin"); ref=$(field ref "$pin")
            [ -n "$branch" ] || continue
            key="$branch $commit"
            [ -z "${done_key[$key]:-}" ] || continue
            done_key[$key]=1

            head=$(git ls-remote "$UPSTREAM" "refs/heads/$branch" | cut -f1)
            if [ -z "$head" ]; then
              echo "::warning::$pin: upstream has no branch $branch"; continue
            fi
            if [ "$head" = "$commit" ]; then
              echo "$branch: pinned commit ${commit:0:9} is the branch head"; continue
            fi

            # The starting commit is part of the name: pins on one branch at
            # different commits (different gateways) each get their own PR.
            topic="vpp-upstream/${branch//\//-}-${commit:0:9}-to-${head:0:9}"
            if [ "$(gh pr list --head "$topic" --state all --json number --jq length)" != 0 ]; then
              echo "$branch: a PR for ${head:0:9} already exists ($topic)"; continue
            fi

            # Paginated: unpaged, compare lists at most 250 commits.
            cmp=$(gh api --paginate "repos/FDio/vpp/compare/${commit}...${head}?per_page=100" | jq -s '
              { ahead_by: .[0].ahead_by, behind_by: .[0].behind_by,
                commits: [.[].commits[]], files: [.[].files[]?] | unique_by(.filename) }')
            behind=$(jq -r .behind_by <<<"$cmp")
            if [ "$behind" != 0 ]; then
              echo "::warning::$branch head ${head:0:9} does not descend from the pinned ${commit:0:9} (behind_by=$behind); not proposing a bump"
              continue
            fi
            ahead=$(jq -r .ahead_by <<<"$cmp")
            commits=$(jq -r '.commits[] | "- [`\(.sha[0:9])`](https://github.com/FDio/vpp/commit/\(.sha)) \(.commit.message | split("\n")[0])"' <<<"$cmp")
            api=$(jq -r '[.files[].filename | select(endswith(".api"))] | join(", ")' <<<"$cmp")
            nfiles=$(jq -r '.files | length' <<<"$cmp")
            ncommits=$(jq -r '.commits | length' <<<"$cmp")
            [ "$ncommits" = "$ahead" ] || echo "::warning::compare listed $ncommits of $ahead commits"

            git switch -q -c "$topic" origin/main
            changed=()
            for p in pins/*.toml; do
              if [ "$(field branch "$p")" = "$branch" ] && [ "$(field commit "$p")" = "$commit" ]; then
                # Same leading whitespace the field() parser accepts.
                sed -i -E "s/^([[:space:]]*commit[[:space:]]*=[[:space:]]*\")${commit}(\")/\1${head}\2/" "$p"
                if [ "$(field commit "$p")" != "$head" ]; then
                  echo "::error::$p: could not move commit to $head"; exit 1
                fi
                changed+=("$p")
              fi
            done
            git add "${changed[@]}"
            git commit -q -m "pins: move ${branch} from ${commit:0:9} to ${head:0:9} (${ref} + upstream fixes)" \
              -m "Proposed by .github/workflows/vpp-upstream.yml: ${ahead} upstream commit(s) on ${branch}."
            git push -q origin "$topic"

            if [ -n "$api" ]; then
              api_note="**API files changed:** ${api}. PacketFrame's vpp-offload checks VPP's API CRCs at attach, so this needs a PacketFrame build generated against the new definitions before any gateway installs it. Compare the \`vpp-api-json.tar.gz\` from the build below with the current release's."
            else
              api_note="**No .api file changed**, so the API CRCs PacketFrame checks at attach are unchanged."
            fi
            truncated=""
            [ "$nfiles" -lt 300 ] || truncated=" (GitHub's compare lists at most 300 files: check the API files by hand)"
            body_file=$(mktemp)
            {
              echo "Moves every pin on \`${branch}\` (${changed[*]}) from \`${commit:0:9}\` to the branch head \`${head:0:9}\`: ${ahead} upstream commit(s) since the pinned one."
              echo
              echo "${api_note}${truncated}"
              echo
              echo "### Upstream commits"
              echo
              echo "${commits}"
              echo
              echo "### Before merging"
              echo
              echo "- The build-and-verify run this workflow started on the branch (publish off) passed, and \`Pin consistency\` passed."
              echo "- Comments in the pins that describe the previous commit are updated."
              echo "- Merging publishes \`vpp-${ref}-${head:0:9}-<platform>-<distro>-<arch>\` for each pin; consumers pin the new release's hashes on their own schedule."
              echo
              echo "Opened by [VPP upstream watch](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            } > "$body_file"
            gh pr create --base main --head "$topic" \
              --title "pins: move ${branch} to ${head:0:9} (${ahead} upstream fixes)" \
              --body-file "$body_file"
            gh workflow run build.yml --ref "$topic" -f publish=false -f force=false -f pin=
            gh workflow run pins.yml --ref "$topic"
            echo "$topic $(git rev-parse HEAD)" >> "$RUNNER_TEMP/proposed"
            git switch -q --detach origin/main
          done

      - name: Propose moves to a newer VPP release line
        shell: bash
        env:
          # Where PacketFrame keeps the .api.json files it generates code
          # from: a changed .api file matters to it only if it is one of
          # these. Best effort: without the listing the PR lists every change.
          PF_VENDORED: repos/unredacted/packetframe/contents/crates/modules/vpp-offload/vpp-api
        run: |
          set -euo pipefail
          field() { grep -E "^\s*$1\s*=" "$2" | head -1 | cut -d'"' -f2 || true; }
          # setf KEY VALUE PIN ANCHOR: rewrite `KEY = "..."`, or add it after
          # the ANCHOR key's line when the pin has none (and VALUE is set).
          setf() {
            if grep -Eq "^[[:space:]]*$1[[:space:]]*=" "$3"; then
              sed -i -E "s|^([[:space:]]*$1[[:space:]]*=[[:space:]]*\")[^\"]*(\")|\1$2\2|" "$3"
            elif [ -n "$2" ]; then
              sed -i -E "s|^([[:space:]]*)$4([[:space:]]*=.*)$|&\n\1$1 = \"$2\"|" "$3"
            fi
            if [ "$(field "$1" "$3")" != "$2" ]; then
              echo "::error::$3: could not set $1 to '$2'"; exit 1
            fi
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Release LINES only (vYY.MM): a point tag like v26.06.1 is the same
          # line as v26.06, whose maintenance the stable-branch step covers.
          latest=$(git ls-remote --tags "$UPSTREAM" 'refs/tags/v*' \
            | sed -E 's#.*refs/tags/##; /\^\{\}$/d' \
            | grep -E '^v[0-9]+\.[0-9]+$' | sort -V | tail -1)
          [ -n "$latest" ] || { echo "::warning::no release tags read from $UPSTREAM"; exit 0; }

          refs=$(for p in pins/*.toml; do field ref "$p"; done | sort -u)
          for ref in $refs; do
            line=$(grep -oE '^v[0-9]+\.[0-9]+' <<<"$ref" || true)
            [ -n "$line" ] || { echo "::warning::pin ref '$ref' is not a release tag"; continue; }
            if [ "$(printf '%s\n%s\n' "$line" "$latest" | sort -V | tail -1)" = "$line" ]; then
              echo "$ref is on the newest VPP release line"; continue
            fi
            # One PR per move; a closed one is a decision, not a reason to ask again.
            topic="vpp-upstream/line-${line}-to-${latest}"
            if [ "$(gh pr list --head "$topic" --state all --json number --jq length)" != 0 ]; then
              echo "$ref: a PR moving to $latest already exists ($topic)"; continue
            fi

            # The commit the tag names (an annotated tag's ^{} line, else the tag itself).
            tagls=$(git ls-remote --tags "$UPSTREAM" "refs/tags/$latest" "refs/tags/$latest^{}")
            tag_sha=$(awk '/\^\{\}$/ { print $1 }' <<<"$tagls")
            [ -n "$tag_sha" ] || tag_sha=$(awk 'NR == 1 { print $1 }' <<<"$tagls")
            [ -n "$tag_sha" ] || { echo "::warning::could not resolve $latest"; continue; }

            # The new line's maintenance branch, when it exists and descends from the tag.
            line_branch="stable/$(sed -E 's/^v([0-9]+)\.([0-9]+)$/\1\2/' <<<"$latest")"
            branch=$line_branch
            head=$(git ls-remote "$UPSTREAM" "refs/heads/$branch" | cut -f1)
            if [ -n "$head" ]; then
              behind=$(gh api "repos/FDio/vpp/compare/${tag_sha}...${head}" --jq .behind_by)
              if [ "$behind" != 0 ]; then
                echo "::warning::$branch head ${head:0:9} does not descend from $latest; proposing the bare tag"
                head=""
              fi
            fi
            [ -n "$head" ] || branch=""
            build=${head:-$tag_sha}

            # What the pins build now: their stable-branch commit, else their tag.
            pins=()
            for p in pins/*.toml; do [ "$(field ref "$p")" = "$ref" ] && pins+=("$p"); done
            old=$(field commit "${pins[0]}")
            if [ -z "$old" ] || [ -z "$(field branch "${pins[0]}")" ]; then
              old=$(git ls-remote --tags "$UPSTREAM" "refs/tags/$ref^{}" "refs/tags/$ref" | awk '{ print $1 }' | tail -1)
            fi

            # Every changed .api file, from a shallow, blob-free fetch of the
            # two trees; blobs are fetched only for the files diffed below.
            work=$(mktemp -d)
            git -C "$work" init -q
            git -C "$work" fetch -q --depth 1 --filter=blob:none "$UPSTREAM" "$old" "$build"
            mapfile -t api < <(git -C "$work" diff --name-only "$old" "$build" -- '*.api')
            vendored=$(gh api "$PF_VENDORED" --jq '.[].name | select(endswith(".api.json")) | rtrimstr(".json")' 2>/dev/null || true)
            pf=(); other=()
            for f in "${api[@]}"; do
              if [ -n "$vendored" ] && grep -qxF "$(basename "$f")" <<<"$vendored"; then pf+=("$f"); else other+=("$f"); fi
            done

            git switch -q -c "$topic" origin/main
            for p in "${pins[@]}"; do
              setf ref "$latest" "$p" ref
              setf branch "$branch" "$p" ref
              setf commit "$head" "$p" branch
            done
            git add "${pins[@]}"
            what="${latest}${head:+ + ${branch} at ${head:0:9}}"
            git commit -q -m "pins: move ${ref} to VPP ${what}" \
              -m "Proposed by .github/workflows/vpp-upstream.yml: FD.io tagged ${latest}."
            git push -q origin "$topic"

            body_file=$(mktemp)
            {
              echo "FD.io has tagged [\`${latest}\`](${UPSTREAM}/releases/tag/${latest}). This moves every pin on \`${ref}\` (${pins[*]}) to ${what}."
              if [ -z "$head" ]; then
                echo
                echo "\`${line_branch}\` does not exist yet (or does not descend from the tag), so this builds the tag alone. Once it exists, set \`branch\` and \`commit\` by hand; from then on the stable-branch watch follows it."
              fi
              echo
              echo "### API"
              echo
              if [ -z "$vendored" ]; then
                echo "PacketFrame's vendored file list could not be read, so every changed \`.api\` file is listed below."
              elif [ "${#pf[@]}" = 0 ]; then
                echo "**No \`.api\` file PacketFrame vendors changed**, so its attach-time CRC check is unaffected; its re-vendor is paperwork."
              else
                echo "**Changed files PacketFrame vendors:** $(printf '`%s` ' "${pf[@]}")"
                echo
                echo '```'
                git -C "$work" diff --stat "$old" "$build" -- "${pf[@]}"
                echo '```'
                echo
                echo "A changed file is not yet wire drift: PacketFrame's re-vendor regenerates \`generated.rs\`, and only a diff there (a whitelisted message changed) needs a new PacketFrame release."
              fi
              echo
              echo "<details><summary>${#api[@]} changed .api file(s) in all</summary>"
              echo
              if [ "${#api[@]}" = 0 ]; then echo "- none"; else printf -- '- `%s`\n' "${api[@]}"; fi
              echo
              echo "</details>"
              echo
              echo "### Before merging"
              echo
              echo "- The build-and-verify run this workflow started on the branch (publish off) passed, and \`Pin consistency\` passed."
              echo "- The pins' comments describe the new line: what changed for the hardware (the octeon driver, octeon-roc), and that it is not yet run on a gateway. The README's Supported gateways table names the new tags."
              echo
              echo "Merging publishes \`vpp-${latest}${head:+-${head:0:9}}-<platform>-<distro>-<arch>\` for each pin and moves nothing on a gateway. Then PacketFrame re-vendors against it, and a lab gateway runs it before any production one."
              echo
              echo "Opened by [VPP upstream watch](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            } > "$body_file"
            gh pr create --base main --head "$topic" \
              --title "pins: move ${ref} to VPP ${latest}" --body-file "$body_file"
            gh workflow run build.yml --ref "$topic" -f publish=false -f force=false -f pin=
            gh workflow run pins.yml --ref "$topic"
            echo "$topic $(git rev-parse HEAD)" >> "$RUNNER_TEMP/proposed"
            git switch -q --detach origin/main
          done

      - name: Report the checks on each proposed PR
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/proposed" ] || { echo "no PR proposed"; exit 0; }
          status() {  # sha context state url description
            gh api "repos/${GITHUB_REPOSITORY}/statuses/$1" -f context="$2" -f state="$3" \
              -f target_url="$4" -f description="$5" >/dev/null
          }
          find_run() {  # workflow topic -> id of its dispatched run (waits up to ~3 min)
            for _ in $(seq 1 36); do
              id=$(gh run list --workflow "$1" --branch "$2" --event workflow_dispatch \
                     --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              [ -n "$id" ] && { echo "$id"; return; }
              sleep 5
            done
          }
          while read -r topic sha; do
            for wf in pins.yml build.yml; do
              ctx="vpp-upstream / ${wf%.yml}"
              id=$(find_run "$wf" "$topic")
              if [ -z "$id" ]; then
                status "$sha" "$ctx" error "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "dispatched run not found"
                continue
              fi
              url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${id}"
              status "$sha" "$ctx" pending "$url" "running"
              if gh run watch "$id" --exit-status --interval 60 >/dev/null; then
                status "$sha" "$ctx" success "$url" "passed"
              else
                status "$sha" "$ctx" failure "$url" "failed"
              fi
            done
          done < "$RUNNER_TEMP/proposed"
