name: VPP build

# Builds UNMODIFIED upstream VPP for UniFi gateways and publishes each
# build under its own release tag, `vpp-<ref>-<platform>-<distro>-<arch>`.
#
# Why this repo exists: no VPP package exists for Debian 11 arm64
# anywhere (fd.io ships noble/jammy arm64 + bookworm amd64; Debian has
# never packaged VPP), and the jammy arm64 deb cannot run on UniFi OS —
# its symbol floor is GLIBC_2.34 against UniFi OS's 2.31, and
# bullseye's dpkg can't even unpack its zstd members. Someone has to
# link VPP against the fleet's libc; this is where.
#
# One pin file per gateway target under pins/ (see pins/efg.toml).
# The artifacts are a function of the PIN ALONE (plus this workflow's
# build config), so the resolve job checks whether each pin's exact
# artifact is already published and skips the build entirely if so —
# even an accidental trigger costs seconds.
#
# Native arm64 runners (free for public repos) with a distro container
# matching the pin: no QEMU, no cross-compile, correct glibc by
# construction.

on:
  push:
    # main ONLY. This workflow has contents:write and derives a
    # canonical release tag from each pin alone, so an unfiltered push
    # trigger would let any collaborator's feature branch publish that
    # tag — and the later main run would then SKIP its build on the
    # existence check, leaving the fleet's artifact built from unmerged
    # workflow code.
    branches: [main]
    paths:
      - 'pins/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the pinned artifact is already published'
        type: boolean
        default: false
      publish:
        description: 'Publish the result (uncheck to build-and-verify only)'
        type: boolean
        default: true
      pin:
        description: 'Build only this pin file (e.g. pins/efg.toml; empty = all)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve pins
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pins.outputs.matrix }}
      any_build: ${{ steps.pins.outputs.any_build }}
    steps:
      - uses: actions/checkout@v7

      - name: Parse pins and decide what needs building
        id: pins
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          force='${{ inputs.force }}'
          only='${{ inputs.pin }}'

          # The tag is derived from each PIN alone, but the artifact is
          # a function of the pin AND this workflow's build config —
          # which disabled-driver overrides made materially true. So a
          # workflow change that alters what gets built would otherwise
          # hit the existence check and skip, leaving the fleet on an
          # artifact built from superseded config, under a tag implying
          # otherwise. Detect it and rebuild everything.
          #
          # Cost note against this file's own cost-control rationale:
          # the workflow path is already a trigger, so this only fires
          # on a push that edited it — a few times a year in practice.
          # It cannot distinguish a comment edit from a driver-list
          # change, and rebuilding needlessly is far cheaper than
          # silently shipping a stale artifact.
          wf_changed=false
          if [ '${{ github.event_name }}' = 'push' ] && \
             [ -n "$BEFORE" ] && \
             [ "$BEFORE" != '0000000000000000000000000000000000000000' ]; then
            if gh api "repos/${{ github.repository }}/compare/${BEFORE}...${{ github.sha }}" \
                 --jq '.files[].filename' 2>/dev/null \
                 | grep -x '.github/workflows/build.yml' >/dev/null; then
              wf_changed=true
            fi
          fi

          entries='[]'
          any_build=false
          for pin in pins/*.toml; do
            if [ -n "$only" ] && [ "$pin" != "$only" ]; then
              echo "skipping $pin (dispatch limited to $only)"
              continue
            fi

            # Deliberately grep-based: adding a TOML parser to a job
            # whose only input is a handful of scalar fields is not
            # worth the dependency. `|| true` on the optional fields:
            # grep exits 1 on no-match and `set -e` would abort the
            # step — so omitting an optional field would have prevented
            # any build at all.
            get() { grep -E "^\s*$1\s*=" "$pin" | head -1 | cut -d'"' -f2 || true; }
            ref=$(get ref)
            commit=$(get commit)
            platform=$(get platform)
            gateway=$(get gateway)
            distro=$(get distro)
            arch=$(get arch)
            glibc_floor=$(get glibc_floor)
            [ -n "$ref" ] || { echo "::error::$pin has no ref"; exit 1; }
            [ -n "$distro" ] || { echo "::error::$pin has no distro"; exit 1; }
            [ -n "$glibc_floor" ] || { echo "::error::$pin has no glibc_floor"; exit 1; }
            [ -n "$platform" ] || platform=generic
            [ -n "$gateway" ] || gateway=unknown
            # Only arm64 targets so far: the runner label and the
            # pinned-checksum CMake tarball below are both aarch64.
            # A future non-arm64 gateway extends both, deliberately —
            # failing here is better than a checksum mismatch two jobs
            # deep.
            [ "$arch" = "arm64" ] || { echo "::error::$pin: arch '$arch' unsupported (only arm64 wired up)"; exit 1; }

            tag="vpp-${ref}-${platform}-${distro}-${arch}"
            echo "$pin -> $tag (gateway: $gateway)"

            needs_build=false
            if [ "$force" = "true" ]; then
              needs_build=true
              echo "  force requested; rebuilding"
            elif ! gh release view "$tag" --repo '${{ github.repository }}' >/dev/null 2>&1; then
              needs_build=true
              echo "  not yet published; building"
            elif [ "$wf_changed" = "true" ]; then
              needs_build=true
              echo "::notice::$tag exists, but this push changed the build workflow — rebuilding and replacing it."
            else
              echo "::notice::$tag is already published; nothing to build. Re-run with force to rebuild."
            fi

            if [ "$needs_build" = "true" ]; then
              any_build=true
              entries=$(jq -c \
                --arg pin "$pin" --arg ref "$ref" --arg commit "$commit" \
                --arg platform "$platform" --arg gateway "$gateway" \
                --arg distro "$distro" --arg arch "$arch" \
                --arg glibc_floor "$glibc_floor" --arg tag "$tag" \
                '. + [{pin:$pin, ref:$ref, commit:$commit, platform:$platform,
                       gateway:$gateway, distro:$distro, arch:$arch,
                       glibc_floor:$glibc_floor, tag:$tag}]' <<<"$entries")
            fi
          done

          echo "matrix=$entries" >> "$GITHUB_OUTPUT"
          echo "any_build=$any_build" >> "$GITHUB_OUTPUT"
          jq . <<<"$entries"

  build:
    name: Build VPP ${{ matrix.ref }} (${{ matrix.platform }}, ${{ matrix.distro }}/${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.any_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    # Native arm64; free on public repos. The container supplies the
    # distro, so the runner image's own version is irrelevant. (resolve
    # asserts arch=arm64 for every pin; a non-arm64 target must extend
    # this runs-on alongside the CMake tarball pin.)
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:${{ matrix.distro }}
    timeout-minutes: 120
    # VPP's `make install-dep` runs its own apt-get, and UNATTENDED=y
    # only adds `-y` — it does not set a debconf frontend. Part of the
    # dependency closure (wireshark-common) asks a debconf question, so
    # apt falls back to the Readline frontend and prompts, and the job
    # HANGS: a container job's stdin is an open pipe that never
    # delivers EOF, so the read parks forever with no error and no
    # output. Observed for 26 minutes before cancellation. (Set
    # job-wide rather than per-step: the per-command form in
    # `Container prerequisites` never reached VPP's nested apt-get.)
    env:
      DEBIAN_FRONTEND: noninteractive
    # Container jobs get `sh -e` as the default shell, and dash has no
    # `set -o pipefail` — the first build attempt died on line 1 of the
    # first step. Everything below is bash; the bootstrap step opts
    # back down to sh because it is what installs bash's guarantees.
    defaults:
      run:
        shell: bash
    steps:
      - name: Container prerequisites
        shell: sh
        run: |
          set -eu
          apt-get update
          # `sudo` because VPP's `make install-dep` invokes it
          # unconditionally; in a root container it must exist and be a
          # no-op passthrough.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates sudo make python3 python3-pip curl xz-utils \
            build-essential file jq
          echo "glibc: $(ldd --version | head -1)"

      - name: Clone upstream VPP at the pinned ref
        run: |
          set -euo pipefail
          git clone --depth 1 --branch '${{ matrix.ref }}' \
            https://github.com/FDio/vpp /vpp
          cd /vpp
          resolved=$(git rev-parse HEAD)
          echo "VPP_COMMIT=$resolved" >> "$GITHUB_ENV"
          expected='${{ matrix.commit }}'
          if [ -n "$expected" ] && [ "$expected" != "$resolved" ]; then
            echo "::error::${{ matrix.pin }} expects commit $expected but ${{ matrix.ref }} resolves to $resolved (upstream retag?)"
            exit 1
          fi
          echo "Building $resolved"
          # Prove we ship upstream: no patches applied anywhere in this
          # workflow. If that ever changes, this assertion must change
          # with it, deliberately.
          git status --porcelain | grep -q . && { echo "::error::working tree dirty after clone"; exit 1; } || true

      - name: Install VPP build dependencies
        run: |
          set -euo pipefail
          cd /vpp
          apt-get update

          # DEB_DEPENDS is evaluated from VPP's own Makefile and
          # filtered against what the distro's archive can actually
          # resolve, because a pinned era's package names drift out
          # from under it: v22.02 asks for `enchant` (renamed
          # enchant-2) and `clang-format-10` (bullseye ships 11/13),
          # and apt refuses the ENTIRE install when any single name is
          # unlocatable — two dead docs/style tools took every real
          # build dependency down with them. Same pattern as the DPDK
          # driver lists: ask make for the effective value, adjust,
          # override on the command line. No tree modification.
          #
          # Dropping unresolvable names is safe by construction here:
          # a dropped DOCS tool costs nothing (build-release builds no
          # docs), and a dropped REAL build dependency fails loudly at
          # build-release — it cannot fail silently, and the dropped
          # list is printed for exactly that diagnosis.
          printf 'include Makefile\n__pf_deps:\n\t@echo $(DEB_DEPENDS)\n' > /tmp/pf-deps.mk
          deps=$(make -s -f /tmp/pf-deps.mk __pf_deps)
          [ -n "$deps" ] || { echo "::error::DEB_DEPENDS evaluated empty — Makefile layout changed?"; exit 1; }
          keep=''; dropped=''
          for p in $deps; do
            if apt-cache show -- "$p" >/dev/null 2>&1; then
              keep="$keep $p"
            else
              dropped="$dropped $p"
            fi
          done
          if [ -n "$dropped" ]; then
            echo "::warning::not in ${{ matrix.distro }}'s archive, dropped from install-dep:$dropped"
          fi

          # `< /dev/null` belt-and-braces alongside the job-level
          # DEBIAN_FRONTEND: a container job's stdin is an open pipe
          # that never delivers EOF, so any package whose maintainer
          # script reads stdin blocks forever rather than failing. The
          # first attempt at this build hung here for 26 minutes on
          # wireshark-common's dumpcap question before being cancelled.
          # Redirecting guarantees a read returns instead of parking.
          UNATTENDED=y make install-dep DEB_DEPENDS="${keep# }" < /dev/null

      # VPP 26.06's CMakeLists.txt sets cmake_minimum_required(3.19);
      # bullseye ships 3.18.4, so `make build-release` aborts at
      # vpp-configure with "CMake 3.19 or higher is required". Note
      # what this does and does not mean: VPP's Makefile really does
      # have debian-11 handling and `install-dep` really does succeed —
      # what has moved past bullseye is the TOOLCHAIN requirement, not
      # dependency packaging. The two are easy to conflate.
      #
      # Upstream's own aarch64 binary, pinned with a checksum rather
      # than pulled from backports: cmake is a build-time tool that
      # leaves no trace in the produced .debs (it cannot raise the
      # glibc floor, which is the only reason we build on the fleet's
      # distro at all), and a pinned tarball does not depend on the
      # lifecycle of a backports suite for a release nearing EOL.
      # Deliberately a 3.31 and not a 4.x: CMake 4 dropped
      # compatibility with cmake_minimum_required < 3.5, which VPP's
      # vendored externals still rely on. Harmless on a distro whose
      # own cmake already clears the floor; asserting the floor is the
      # point, not the install.
      - name: Install CMake (distro's may be below VPP's floor)
        env:
          CMAKE_VERSION: '3.31.9'
          CMAKE_SHA256: '09b7127b09e3d3ed5fa894f4e59f6a01112f267da6acc4249e46dba97b14afcb'
        run: |
          set -euo pipefail
          series="${CMAKE_VERSION%.*}"
          tarball="cmake-${CMAKE_VERSION}-linux-aarch64.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" \
            "https://cmake.org/files/v${series}/${tarball}"
          echo "${CMAKE_SHA256}  /tmp/${tarball}" | sha256sum -c -
          # --strip-components=1 into /usr/local keeps cmake's modules
          # in the share/ path it resolves relative to the binary.
          tar -xzf "/tmp/${tarball}" -C /usr/local --strip-components=1
          hash -r
          cmake --version
          # /usr/local/bin precedes /usr/bin, but assert rather than
          # assume: install-dep may have pulled the distro's cmake, and
          # silently building with 3.18 is the failure we just fixed.
          have=$(cmake --version | head -1 | awk '{print $3}')
          major=${have%%.*}; rest=${have#*.}; minor=${rest%%.*}
          if [ "$major" -lt 3 ] || { [ "$major" -eq 3 ] && [ "$minor" -lt 19 ]; }; then
            echo "::error::cmake $have is below VPP's 3.19 floor (which cmake: $(command -v cmake))"
            exit 1
          fi

      # VPP's DPDK recipe disables the ENTIRE cnxk family by default —
      # `common/cnxk`, `net/cnxk`, `mempool/cnxk`, `crypto/cnxk` all
      # appear in DPDK_DRIVERS_DISABLED, and `cnxk` in
      # DPDK_LIBS_DISABLED. That is upstream's choice for a portable
      # build, and it is why the first artifact carried no Octeon
      # driver at all: not a packaging accident, and not something a
      # different VPP version fixes, because the disable list is
      # long-standing. VPP 26.06 also has no native `dev_octeon` in
      # vpp_drivers/ for a generic build — the native driver is gated
      # on VPP_PLATFORM — so DPDK's cnxk PMD is the only way a generic
      # VPP can reach an Octeon NIC.
      #
      # Re-enabling it is a BUILD-CONFIG override, not a patch: the
      # source tree stays verbatim (the clone step still asserts a
      # clean working tree), we only pass different make variables.
      #
      # Derived from the pinned tree rather than hardcoded, so the rest
      # of upstream's disable list keeps whatever upstream decides it
      # should be across version bumps; we subtract cnxk and nothing
      # else. Enabled unconditionally rather than under the cn9k
      # platform, because `platform` means CPU TUNING here — a generic
      # armv8-a build still has to drive the fleet's NIC.
      - name: Re-enable the cnxk driver family in DPDK
        run: |
          set -euo pipefail
          cd /vpp/build/external
          # Ask make for the EFFECTIVE lists rather than parsing the
          # .mk. Parsing is wrong here in a way that is easy to miss:
          # the base lists are `:=` continued over ~40 backslashed
          # lines, and dpdk.mk then APPENDS to them conditionally
          # (net/tap, net/failsafe, and the mlx family, depending on
          # DPDK_*_PMD). A file-scraped base list would silently drop
          # those and enable drivers upstream meant to stay off.
          # Including the real Makefile evaluates all of it, including
          # the package versions dpdk.mk requires to parse at all.
          # printf, not a heredoc: make demands a literal TAB to start a
          # recipe line, and a heredoc indented to match this YAML block
          # would prepend spaces (while `<<-` strips tabs, including the
          # one that matters). Single quotes keep `$(...)` for make.
          printf 'include Makefile\n__pf_print:\n\t@echo "$(DPDK_DRIVERS_DISABLED)"\n\t@echo "$(DPDK_LIBS_DISABLED)"\n' \
            > /tmp/pf-dpdk-vars.mk
          vars=$(make -s -f /tmp/pf-dpdk-vars.mk __pf_print | tail -2)
          drivers=$(printf '%s' "$vars" | sed -n 1p)
          libs=$(printf '%s' "$vars" | sed -n 2p)

          filter() {
            # Drop every member of the Octeon driver families and
            # nothing else: cnxk (common/, net/, mempool/, crypto/, and
            # the bare `cnxk` lib) plus octeontx2, the name the same
            # silicon used before DPDK 22.11 renamed it.
            #
            # octeontx2 is a no-op on every version in the fallback
            # ladder — checked, not assumed: v22.02 disables neither
            # family (so its octeontx2 PMD is on by default), v23.06
            # disables only cnxk, and 26.03 has no octeontx2 driver at
            # all. It is here as insurance for a version that does,
            # since removing an absent entry costs nothing.
            #
            # Deliberately NOT matched: compress/octeontx, event/octeontx
            # and mempool/octeontx — those are OCTEON TX v1, different
            # silicon, and upstream means them disabled. `octeontx2`
            # cannot match `octeontx`.
            printf '%s' "$1" | tr ',' '\n' \
              | grep -v -e cnxk -e octeontx2 | grep -v '^$' | paste -sd, -
          }
          for pair in "DRIVERS:$drivers" "LIBS:$libs"; do
            name=${pair%%:*}; val=${pair#*:}
            # An empty or single-token result means the evaluation went
            # wrong; overriding with it would enable every driver DPDK
            # has. Stopping here is much cheaper than that build.
            case "$val" in
              *,*) : ;;
              *) echo "::error::DPDK_${name}_DISABLED evaluated to '$val' — upstream layout changed?"; exit 1 ;;
            esac
            echo "$name removing: $(printf '%s' "$val" | tr ',' '\n' | grep -e cnxk -e octeontx2 | paste -sd, - || echo none)"
          done
          printf '%s' "$drivers" | grep -q -e cnxk -e octeontx2 \
            || echo "::warning::upstream disables no Octeon driver family at this ref; the override is a no-op (fine — it means the PMD ships enabled)"

          {
            echo "DPDK_DRIVERS_KEPT=$(filter "$drivers")"
            echo "DPDK_LIBS_KEPT=$(filter "$libs")"
          } >> "$GITHUB_ENV"

      - name: Build release
        run: |
          set -euo pipefail
          cd /vpp
          # Command-line make variables override the makefile's own
          # assignments (these are `=`/`:=`, not `?=`, so environment
          # alone would lose) and propagate to the external sub-make.
          args=(
            "DPDK_DRIVERS_DISABLED=$DPDK_DRIVERS_KEPT"
            "DPDK_LIBS_DISABLED=$DPDK_LIBS_KEPT"
          )
          case '${{ matrix.platform }}' in
            octeon9)
              # VPP's first-class Marvell platform (src/cmake/platform/
              # octeon9.cmake: armv8.2-a+crc+crypto, 128B cache lines —
              # correct for CN96xx, still runs on Neoverse CI runners).
              # This is the ONLY build shape that produces the NATIVE
              # octeon driver (src/drivers/octeon is gated on
              # VPP_PLATFORM_NAME octeon9|octeon10), which is in turn
              # the only mainline path onto the EFG's NIC: the DPDK
              # PMDs inside VPP hard-require NPA mempool ops that VPP's
              # buffer manager does not provide (measured on the
              # reference EFG, 2026-08-02; no bypass exists in otx2 or
              # cnxk). The native driver links octeon-roc, whose model
              # table — unlike DPDK's stale copy — knows the cn9670's
              # CN96xx D0 stepping.
              args+=(VPP_EXTRA_CMAKE_ARGS='-DVPP_PLATFORM=octeon9')
              ;;
            cn9k)
              # Legacy DPDK-era tuning, for octeontx2-era pins
              # (e.g. v22.02): LSE atomics + tuned memcpy + DPDK's own
              # cn9k platform tuning.
              args+=(DPDK_MACHINE=cn9k VPP_EXTRA_CMAKE_ARGS='-DVPP_LIBRARY_FLAGS=-mcpu=octeontx2')
              ;;
          esac
          printf 'make arg: %s\n' "${args[@]}"
          make build-release "${args[@]}"

      - name: Package .debs
        run: |
          set -euo pipefail
          cd /vpp
          make pkg-deb
          mkdir -p /out/debs
          find build-root -maxdepth 1 -name '*.deb' -exec cp {} /out/debs/ \;
          ls -la /out/debs
          [ -n "$(ls -A /out/debs)" ] || { echo "::error::no .debs produced"; exit 1; }

      # The ONE packaging deviation from upstream (recorded in the
      # manifest and release notes; the source is still unmodified).
      #
      # upstream's vpp .deb ships /etc/sysctl.d/80-vpp.conf with
      # vm.nr_hugepages=1024, written for 2 MB pages. The install-time
      # trap is survivable (VPP_INSTALL_SKIP_SYSCTL=1 skips the
      # postinst's `sysctl --system`) — but the FILE is package
      # content, systemd re-applies it on EVERY boot, and on UniFi's
      # 64K-page kernels (512 MB default hugepage) it is a 512 GiB
      # request. On 2026-08-21 it bricked a 64 GB EFG on the first
      # post-install reboot: ~all RAM reserved before userspace could
      # configure an interface; recovery took a factory reset.
      # Hugepage sizing on the fleet belongs to the consumer
      # (packetframe's vpp-offload) at attach, never to boot config.
      #
      # The plain `rm` (no -f) is deliberate: if upstream stops
      # shipping the file, this step fails loudly and gets removed,
      # rather than silently guarding against nothing.
      - name: Remove the boot-time hugepage sysctl from the vpp .deb
        run: |
          set -euo pipefail
          vpp_deb=$(find /out/debs -maxdepth 1 -name 'vpp_*.deb')
          [ -n "$vpp_deb" ] || { echo "::error::vpp_*.deb not found to defuse"; exit 1; }
          rm -rf /tmp/defuse
          dpkg-deb -R "$vpp_deb" /tmp/defuse
          rm /tmp/defuse/etc/sysctl.d/80-vpp.conf
          rmdir --ignore-fail-on-non-empty /tmp/defuse/etc/sysctl.d
          # A conffiles entry pointing at a file the package no longer
          # contains makes dpkg unhappy at install; md5sums likewise.
          for meta in conffiles md5sums; do
            f="/tmp/defuse/DEBIAN/$meta"
            if [ -f "$f" ]; then
              sed -i '\#etc/sysctl\.d/80-vpp\.conf#d' "$f"
              if grep -q '80-vpp' "$f"; then
                echo "::error::DEBIAN/$meta still references 80-vpp.conf after defusing"; exit 1
              fi
            fi
          done
          dpkg-deb -b --root-owner-group /tmp/defuse "$vpp_deb"
          if dpkg-deb -c "$vpp_deb" | grep -q '80-vpp\.conf'; then
            echo "::error::80-vpp.conf still present after defusing"; exit 1
          fi
          echo "defused: $vpp_deb ships no boot-time hugepage sysctl"

      # Fast smoke test on the staging tree so an obviously broken
      # build fails before we spend time packaging. It is NOT the
      # gate — the staging tree has every build dependency present and
      # the binaries at build paths, so it cannot catch a package that
      # omits a library, installs to the wrong path, or is missing
      # dependency metadata. The `verify-package` job below does that.
      - name: Smoke-test the build tree
        run: |
          set -euo pipefail
          root=/vpp/build-root/install-vpp-native/vpp
          vpp_bin="$root/bin/vpp"
          [ -x "$vpp_bin" ] || { echo "::error::no vpp binary at $vpp_bin"; exit 1; }

          # THE regression guard: this is the exact check that killed the
          # fd.io jammy deb (GLIBC_2.34 vs UniFi OS's 2.31). An artifact
          # that can't load on the fleet must never reach a release page.
          # The floor comes from the pin's [target] section.
          floor=$(objdump -T "$vpp_bin" | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -1)
          echo "glibc symbol floor: ${floor:-none} (pin allows <= GLIBC_${{ matrix.glibc_floor }})"
          max_minor=$(echo "${floor:-GLIBC_2.0}" | cut -d. -f2)
          floor_minor='${{ matrix.glibc_floor }}'; floor_minor=${floor_minor#*.}
          if [ "$max_minor" -gt "$floor_minor" ]; then
            echo "::error::binary requires $floor but ${{ matrix.gateway }}'s UniFi OS ships glibc ${{ matrix.glibc_floor }}"
            exit 1
          fi

          # Layout, for the record. Printed unconditionally because the
          # first version of this step hardcoded lib/vpp_plugins and VPP
          # installs to a multiarch libdir; having the tree in the log
          # makes the next path surprise self-diagnosing.
          echo "--- install tree ---"
          find "$root" -maxdepth 3 -type d | sort

          # The NIC driver must be in the artifact, or VPP cannot touch
          # the hardware at all. Three shapes to accept, because which
          # one you get is a build option, not a constant: VPP's native
          # octeon driver (platform builds), a PMD linked INTO
          # dpdk_plugin.so, or a standalone librte_net_*.so under
          # dpdk/pmds-<abi>/. Checking only one is how a perfectly good
          # build got failed.
          # Search BOTH install prefixes. `$root` is VPP's own
          # (install-vpp-native/vpp); DPDK installs alongside it under
          # install-vpp-native/external, and looking only at the former
          # is why a build with cnxk enabled still reported no driver.
          instroot=/vpp/build-root/install-vpp-native

          echo "--- driver inventory ---"
          find "$instroot" \( -path '*vpp_drivers*' -o -path '*vpp_plugins*' \
            -o -path '*dpdk/pmds*' -o -name 'librte_net_*' \) -type f | sort
          echo "--- octeon artifacts anywhere under the install trees ---"
          find "$instroot" \( -name '*cnxk*' -o -name '*octeontx2*' -o -name 'dev_octeon*' -o -name 'octeon_driver*' \) \
            | sort | head -40
          echo "--- end inventory ---"

          plugin=$(find "$root" -name 'dpdk_plugin.so' -print -quit)

          # Probe sanity, printed every run. `strings dpdk_plugin.so |
          # grep net_cnxk` was the previous gate, and it reported NONE
          # on a build whose meson summary listed cnxk under "Drivers
          # Enabled" — so the probe, not the build, was wrong. Showing
          # which PMD names (if any) the plugin actually contains makes
          # that visible instead of inferable: an empty list here means
          # DPDK's drivers are not linked into the plugin at all, but
          # loaded at runtime from dpdk/pmds-<abi>/ (which is what
          # `symlink-drivers-solibs.sh lib dpdk/pmds-26.1` in the build
          # log is doing).
          if [ -n "$plugin" ]; then
            names=$(strings "$plugin" | grep -oE '^net_[a-z0-9_]+$' | sort -u | tr '\n' ' ' || true)
            echo "PMD names inside $(basename "$plugin"): ${names:-<none, so DPDK PMDs are not linked in>}"
          fi

          # How a DPDK driver actually reaches VPP in this build — read
          # from the pinned tree, not assumed (dpdk.mk + the plugin's
          # CMakeLists):
          #
          #   - VPP_USE_SYSTEM_DPDK is OFF, so the plugin links
          #     `libdpdk.a` wrapped in --whole-archive. That "archive"
          #     is a LINKER SCRIPT dpdk.mk writes at install:
          #     `GROUP ( $(ls librte*.a) )`.
          #   - dpdk.mk then DELETES every shared driver object,
          #     including the dpdk/pmds-<abi>/ directory the
          #     symlink-drivers-solibs.sh install hook just populated.
          #     There is no runtime-loadable PMD shape in this build;
          #     an earlier revision of this step believed there was.
          #
          # Consequence: a surviving librte_net_cnxk.a proves DPDK
          # BUILT the driver, but the artifact only works if that .a
          # actually got whole-archived into dpdk_plugin.so — so when
          # both exist, the plugin must contain the driver's REGISTERED
          # names.
          #
          # And those names are NOT the library's name. This cost a
          # full CI round: the cnxk PMD registers one driver per SoC
          # generation — net_cn9k, net_cn10k, net_cn20k — and no
          # string `net_cnxk` exists in any working build. A probe
          # grepping for the library name reported a perfectly good
          # plugin as driverless. The needle below is the set of
          # REGISTERED names across the eras we can pin: cn9k/cn10k/
          # cn20k (cnxk era) and net_octeontx2 (<= DPDK 21.11 era).
          # The EFG is cn9670 = CN9K, so net_cn9k specifically is
          # the load-bearing one.
          OCTEON_PMD_NAMES='net_cn9k|net_cn10k|net_cn20k|net_octeontx2'
          # The native driver installs as vpp_drivers/octeon_driver.so —
          # verified from src/drivers CMake (`add_vpp_driver(octeon)`,
          # same pattern as atlantic_driver.so), NOT as dev_octeon*.
          # The old needle predated reading the tree; keep both names
          # in case upstream renames back.
          native=$(find "$instroot" \( -name 'octeon_driver.so*' -o -name 'dev_octeon*.so*' \) -print -quit)
          pmd_lib=$(find "$instroot" \( -name 'librte_net_cnxk*' -o -name 'librte_net_octeontx2*' \) -print -quit)
          driver=''
          if [ -n "$native" ]; then
            echo "native Octeon driver: $native"
            driver=dev_octeon
          fi
          if [ -n "$plugin" ]; then
            matched=$(strings "$plugin" | grep -oE "$OCTEON_PMD_NAMES" | sort -u | paste -sd, - || true)
            if [ -n "$matched" ]; then
              echo "Octeon drivers linked into $(basename "$plugin"): $matched"
              driver="${driver:+$driver,}$matched"
              # Hard requirement, not a warning: the fleet is cn9670 =
              # CN9K, so a plugin carrying only net_cn10k/net_cn20k
              # cannot drive a single one of our NICs. "Has Octeon
              # drivers" is not the gate; "has OUR Octeon driver" is —
              # publishing the former as verified would be the exact
              # lie this step exists to stop.
              case ",$matched," in
                *,net_cn9k,*|*,net_octeontx2,*) : ;;
                *)
                  echo "::error::plugin has Octeon drivers ($matched) but none that drives CN9K silicon (need net_cn9k or net_octeontx2) — unusable on this fleet"
                  exit 1
                  ;;
              esac
            elif [ -n "$pmd_lib" ]; then
              echo "::error::an Octeon PMD was built ($pmd_lib) but none of its registered driver names ($OCTEON_PMD_NAMES) appear in dpdk_plugin.so — built but not linked, and nothing loads PMDs at runtime (dpdk.mk deletes the shared objects at install)."
              exit 1
            fi
          elif [ -n "$pmd_lib" ]; then
            # No dpdk plugin at all: the .a alone is unreachable.
            echo "::error::$(basename "$pmd_lib") built but dpdk_plugin.so is missing entirely"
            exit 1
          fi
          echo "octeon driver(s): ${driver:-NONE}"
          if [ -z "$driver" ]; then
            echo "::error::this build produced no Octeon driver — neither VPP's native dev_octeon nor a DPDK cnxk/octeontx2 PMD (see inventory above)"
            exit 1
          fi
          echo "PMD_FAMILY=$driver" >> "$GITHUB_ENV"

          # Unresolved-symbol smoke test. `vpp -h` needs its own libs on
          # the path; a clean exit or a usage message both prove linkage.
          # Every lib dir, not a guessed one, for the multiarch reason
          # above.
          LD_LIBRARY_PATH=$(find "$root" -type d -name 'lib*' -maxdepth 2 | tr '\n' ':')
          export LD_LIBRARY_PATH
          "$vpp_bin" -h >/dev/null 2>&1 || true
          ldd "$vpp_bin" | grep -q 'not found' && { echo "::error::unresolved shared libs"; ldd "$vpp_bin" | grep 'not found'; exit 1; } || true

      - name: Collect API definitions (binary-API codegen input)
        run: |
          set -euo pipefail
          mkdir -p /out/api
          # Published as a separate small asset so a consumer's codegen
          # never downloads ~100 MB of .debs just to read message
          # definitions. Located rather than hardcoded, for the
          # multiarch reason in the smoke-test step. Copying the api dir
          # wholesale keeps upstream's core/ vs plugins/ split, which
          # packetframe's codegen uses to namespace generated modules;
          # the fallback flattens because a build tree without
          # share/vpp/api has no split to preserve anyway.
          # The INSTALL tree explicitly, not a find. The first published
          # bundle was collected with `find ... -print -quit`, which
          # stopped at a partially-populated build-stage directory and
          # shipped 89 plugin files with ZERO core ones — no memclnt
          # (the handshake), no ip (routes), no ip_neighbor, no dev
          # (device attach). Codegen is dead without those, and a
          # count-only check cannot notice their absence.
          api_dir=/vpp/build-root/install-vpp-native/vpp/share/vpp/api
          [ -d "$api_dir" ] || api_dir=$(find /vpp/build-root/install-vpp-native \
            -type d -path '*/share/vpp/api' -print -quit)
          [ -n "$api_dir" ] && [ -d "$api_dir" ] || { echo "::error::no share/vpp/api under the install tree"; exit 1; }
          echo "api dir: $api_dir"
          cp -r "$api_dir/." /out/api/
          count=$(find /out/api -name '*.api.json' | wc -l)
          echo "api.json files: $count"
          # The files packetframe's codegen actually consumes. Named,
          # not counted: 89 files that lack the handshake are worthless.
          for f in core/memclnt.api.json core/ip.api.json \
                   core/ip_neighbor.api.json core/interface.api.json \
                   core/dev.api.json; do
            [ -f "/out/api/$f" ] || { echo "::error::API bundle missing $f — codegen input incomplete"; exit 1; }
          done
          tar czf /out/vpp-api-json.tar.gz -C /out/api .

      - name: Write manifest
        run: |
          set -euo pipefail
          cd /out
          jq -n \
            --arg ref '${{ matrix.ref }}' \
            --arg commit "$VPP_COMMIT" \
            --arg platform '${{ matrix.platform }}' \
            --arg gateway '${{ matrix.gateway }}' \
            --arg distro 'debian-${{ matrix.distro }}' \
            --arg arch '${{ matrix.arch }}' \
            --arg pmd "${PMD_FAMILY:-unknown}" \
            --arg built_by '${{ github.repository }}@${{ github.sha }}' \
            --arg run '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            '{vpp_ref:$ref, vpp_commit:$commit, platform:$platform, gateway:$gateway,
              distro:$distro, arch:$arch, octeon_pmd:$pmd,
              patches:"none (upstream verbatim)",
              packaging:"etc/sysctl.d/80-vpp.conf removed from the vpp .deb — applied at every boot, its vm.nr_hugepages=1024 is a 512 GiB hugepage request on 64K-page kernels (bricked a 64 GB EFG 2026-08-21); hugepage sizing belongs to the consumer at attach",
              built_by:$built_by, workflow_run:$run}' > manifest.json
          # Flat names: `gh release create` uploads these as flat
          # assets, so a `debs/` prefix would make `sha256sum -c`
          # unverifiable after a download-into-one-directory (which is
          # exactly what consumers' install instructions tell people
          # to do).
          ( cd debs && sha256sum ./*.deb | sed 's#\./##' ) > SHA256SUMS
          sha256sum vpp-api-json.tar.gz >> SHA256SUMS
          cat manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.tag }}
          path: |
            /out/debs/*.deb
            /out/vpp-api-json.tar.gz
            /out/manifest.json
            /out/SHA256SUMS
          retention-days: 14

  verify-package:
    name: Verify installed package (clean ${{ matrix.distro }})
    needs: [resolve, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:${{ matrix.distro }}
    defaults:
      run:
        shell: bash
    steps:
      # Deliberately a FRESH container with no build dependencies: the
      # question this job answers is "does what we publish install and
      # run on a stock fleet box", which the build tree cannot answer.
      - name: Bootstrap
        shell: sh
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates binutils

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.tag }}
          path: /pkg

      - name: Install the built packages
        run: |
          set -euo pipefail
          find /pkg -type f | sort
          # The .debs sit under /pkg/debs/: upload-artifact roots the
          # artifact at the least common ancestor of its path patterns
          # (/out), so the debs/ component survives the round trip. A
          # bare /pkg/*.deb glob matches nothing and, unexpanded, gets
          # handed to apt as a literal filename. Locate them instead —
          # this job had never actually run before, so the shape of the
          # download was assumption, not observation.
          mapfile -t debs < <(find /pkg -name '*.deb' | sort)
          [ "${#debs[@]}" -gt 0 ] || { echo "::error::no .deb in the artifact"; exit 1; }
          printf 'installing: %s\n' "${debs[@]}"
          # `apt-get install ./*.deb` (not `dpkg -i`) so unmet
          # dependencies fail loudly here rather than on a router.
          #
          # VPP_INSTALL_SKIP_SYSCTL is upstream's own knob (read the
          # postinst: "Allow for a nerd knob to skip this, e.g. during
          # the container installs"). Without it, vpp.postinst runs
          # `sysctl --system`: in this container that dies on a missing
          # sysctl binary — and installing procps would only trade that
          # for an EPERM on the container's read-only /proc/sys/vm. The
          # knob is ALSO mandatory on the fleet, for a harsher reason:
          # the deb ships vm.nr_hugepages=1024 written for 2MB pages,
          # and on the routers' 64K-page kernel (512MB default
          # hugepages) applying it requests 512 GiB of hugepages on a
          # 64 GB box, at install time. See this repo's README install
          # section.
          DEBIAN_FRONTEND=noninteractive VPP_INSTALL_SKIP_SYSCTL=1 \
            apt-get install -y "${debs[@]}"
          command -v vpp || { echo "::error::no vpp on PATH after install"; exit 1; }
          # The 2026-08-21 landmine: the deb must NOT have planted the
          # boot-time hugepage sysctl the build step removed. This is
          # the check that fails if the defuse step ever regresses.
          if [ -e /etc/sysctl.d/80-vpp.conf ]; then
            echo "::error::/etc/sysctl.d/80-vpp.conf present after install — the boot-time 512 GiB hugepage landmine shipped"; exit 1
          fi
          echo "no boot-time hugepage sysctl installed — correct"

      - name: Verify the INSTALLED binary
        run: |
          set -euo pipefail
          vpp_bin=$(command -v vpp)
          echo "installed at: $vpp_bin"

          # The check that killed the fd.io deb, now applied to what we
          # actually ship rather than to a staging tree.
          floor=$(objdump -T "$vpp_bin" | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -1)
          echo "glibc symbol floor: ${floor:-none} (pin allows <= GLIBC_${{ matrix.glibc_floor }})"
          floor_minor='${{ matrix.glibc_floor }}'; floor_minor=${floor_minor#*.}
          if [ "$(echo "${floor:-GLIBC_2.0}" | cut -d. -f2)" -gt "$floor_minor" ]; then
            echo "::error::installed binary requires $floor but ${{ matrix.gateway }}'s UniFi OS ships glibc ${{ matrix.glibc_floor }}"
            exit 1
          fi

          # No unresolved libraries with only the package's own
          # dependencies installed.
          if ldd "$vpp_bin" | grep -q 'not found'; then
            echo "::error::unresolved shared libraries after install:"
            ldd "$vpp_bin" | grep 'not found'
            exit 1
          fi

          # The NIC driver must survive packaging, not merely exist in
          # the build tree. Same three shapes the build-tree smoke test
          # accepts — VPP's native dev_octeon, a standalone DPDK PMD, or
          # one linked into dpdk_plugin.so — because which one this VPP
          # ships is a property of the release, not a constant.
          native=$(find / \( -name 'octeon_driver.so*' -o -name 'dev_octeon*.so*' \) -not -path '/proc/*' -print -quit 2>/dev/null || true)
          pmd_so=$(find / \( -name 'librte_net_cnxk*' -o -name 'librte_net_octeontx2*' \) \
            -not -path '/proc/*' -print -quit 2>/dev/null || true)
          plugin=$(find / -name dpdk_plugin.so -not -path '/proc/*' -print -quit 2>/dev/null || true)
          if [ -n "$native" ]; then
            echo "installed native Octeon driver: $native"
          elif [ -n "$pmd_so" ]; then
            echo "installed standalone PMD: $pmd_so"
          elif [ -n "$plugin" ] && strings "$plugin" | grep -E 'net_cn9k|net_octeontx2' >/dev/null; then
            # REGISTERED driver names, not the library name (`net_cnxk`
            # exists in no working build — see the smoke test's needle
            # note), and only the names that can drive CN9K silicon:
            # a plugin with just net_cn10k/net_cn20k is unusable on
            # this fleet and must not verify.
            #
            # `grep -E ... >/dev/null`, NOT `grep -q`: under this
            # step's pipefail, -q exits at the first match, the
            # still-writing strings gets SIGPIPE (141), and the
            # pipeline — and so this condition — goes false on a GOOD
            # plugin. Without -q grep reads the stream to EOF, so the
            # pipeline status is grep's own.
            echo "installed PMD linked into: $plugin"
          else
            echo "::error::the installed packages carry no Octeon driver (native or DPDK)"
            exit 1
          fi
          echo "installed package verified: loads, resolves, and carries an Octeon driver"

  # Publishing is a SEPARATE job gated on verify-package, not a final
  # step of `build`. It used to be the latter, which meant the .debs
  # were downloadable before anything had tried installing them: a
  # package that failed verification was already on the release page,
  # and consumers were told that a published artifact had been
  # verified. Ordering, not wording, is what makes that true.
  publish:
    name: Publish release
    needs: [resolve, build, verify-package]
    # A push-triggered run leaves `inputs.publish` empty, which coerces
    # equal to `false` — so the PRIMARY automatic trigger would spend
    # the whole build and publish nothing, leaving consumers' release
    # pointers dangling. Gate on the event.
    if: github.event_name == 'push' || inputs.publish
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.tag }}
          path: /tmp/pkg

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/pkg
          find . -type f | sort
          # Facts come from the manifest the build wrote, not from job
          # env: this job runs on a different runner, and re-deriving
          # them here would let the release notes disagree with the
          # artifact they describe.
          commit=$(jq -r '.vpp_commit' manifest.json)
          pmd=$(jq -r '.octeon_pmd' manifest.json)
          tag='${{ matrix.tag }}'
          notes=$(printf '%s\n' \
            "Unmodified upstream VPP \`${{ matrix.ref }}\` (\`$commit\`), built for Debian ${{ matrix.distro }} ${{ matrix.arch }} — the combination UniFi OS on the \`${{ matrix.gateway }}\` can install." \
            "" \
            "Variant: \`${{ matrix.platform }}\` · Octeon PMD: \`$pmd\` · No patches applied." \
            "" \
            "**One packaging deviation** (the only one): \`etc/sysctl.d/80-vpp.conf\` is removed from the \`vpp\` .deb. Applied at every boot, its \`vm.nr_hugepages=1024\` (written for 2 MB pages) is a 512 GiB hugepage request on 64K-page UniFi kernels — it bricked a 64 GB EFG on 2026-08-21. Hugepage sizing belongs to the consumer at attach; see the README's install section." \
            "" \
            "Verified in CI before publication: glibc symbol floor ≤ ${{ matrix.glibc_floor }}, no unresolved shared libraries, Octeon driver present, and the .debs install cleanly into a stock ${{ matrix.distro }}." \
            "" \
            "\`vpp-api-json.tar.gz\` is the API-definition bundle for binary-API codegen (consumed by unredacted/packetframe's vpp-offload module); it is published separately so codegen does not download the .debs." \
            "" \
            "Install order and operational guidance: this repo's README.")
          title="VPP ${{ matrix.ref }} (${{ matrix.platform }}, ${{ matrix.distro }}/${{ matrix.arch }})"
          # Flat asset names, matching SHA256SUMS — see the manifest
          # step's note on why that matters after a download.
          #
          # The tag can already exist: resolve rebuilds when the build
          # workflow itself changed, since the artifact depends on this
          # file's config and not on the pin alone. Update in place
          # (`--clobber`) rather than delete-and-recreate, so there is
          # no window where the release consumers point operators at
          # does not exist.
          if gh release view "$tag" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "::notice::$tag exists — replacing its assets"
            gh release edit "$tag" --repo '${{ github.repository }}' \
              --title "$title" --notes "$notes"
            gh release upload "$tag" --repo '${{ github.repository }}' --clobber \
              debs/*.deb vpp-api-json.tar.gz manifest.json SHA256SUMS
          else
            gh release create "$tag" \
              --repo '${{ github.repository }}' \
              --title "$title" \
              --notes "$notes" \
              debs/*.deb vpp-api-json.tar.gz manifest.json SHA256SUMS
          fi
          echo "::notice::published $tag"
